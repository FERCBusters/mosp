name: myf CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Images are pinned by digest, actions by commit.
    container:
      image: docker.io/library/debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    env:
      PYTHON_BIN: python3
      POETRY_VERSION: "2.4.1"
    steps:
      - name: Install system dependencies
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-pip build-essential

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Poetry
        run: |
          set -eu
          "${PYTHON_BIN}" -m venv /opt/myf-ci-poetry
          /opt/myf-ci-poetry/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo /opt/myf-ci-poetry/bin >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: |
          poetry env use "${PYTHON_BIN}"
          poetry install --with dev --no-interaction --no-ansi

      - name: Check formatting, lint and types
        run: |
          poetry run ruff format --check .
          poetry run ruff check .
          poetry run mypy

      - name: Run tests
        run: poetry run pytest --cov=myf --cov-branch --cov-report=term
