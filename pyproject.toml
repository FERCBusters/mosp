[tool.poetry]
name = "myf"
version = "0.1.0"
description = "My Framework: the shared backend of KEEN, OSPMAE and MIDENA (sign-in, sessions, SSO, MFA, CSRF, RBAC and security primitives)"
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "myf" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.141"
pydantic = "^2"
pydantic-settings = "^2.14"
sqlalchemy = "^2.0"
redis = "^8"
authlib = "^1.8"
joserfc = "^1.7.5"
httpx2 = "^2.13.1"
webauthn = "^2.8"
pyotp = "^2.10"
qrcode = "^8.2"
cryptography = ">=50"
regex = "^2026.9.29"
ldap3 = "^2.9.1"
anyio = "^4"
celery = "^5.6"
python-multipart = "0.0.32"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
fakeredis = "^2.39"
pytest-cov = ">=7,<8"
ruff = "0.17.0"
mypy = "2.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["myf"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["authlib.*", "celery.*", "ldap3.*", "qrcode.*", "regex.*"]
ignore_missing_imports = true
